<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="دریافت و دانلود فایل PDF از طریق QR Code">
  <title>زنجیره تامین صدر آسیا</title>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- استایل‌ها -->
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --primary: #0b1f3a; /* سرمه‌ای */
      --primary-soft: #102b4e;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --red: #e11d48;
      --red-hover: #be123c;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 4px 14px rgba(2, 12, 27, 0.05);
      --shadow-md: 0 18px 35px -12px rgba(2, 12, 27, 0.12);
      --shadow-lg: 0 25px 45px -15px rgba(37, 99, 235, 0.18);
      --radius: 22px;
      --radius-sm: 14px;
      --transition: 0.22s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.04), transparent 32%),
        radial-gradient(circle at 90% 8%, rgba(225, 29, 72, 0.04), transparent 28%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 36px;
    }

    .page {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      animation: pageFadeIn 0.6s ease both;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header / Logo */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.7);
      animation: logoIn 0.6s ease both;
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--blue);
    }

    .logo-fallback svg {
      width: 36px;
      height: 36px;
    }

    .logo-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    /* Main Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 28px 24px;
      border: 1px solid rgba(226, 232, 240, 0.7);
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .main-card {
      text-align: center;
      animation: cardFadeUp 0.6s ease 0.05s both;
    }

    @keyframes cardFadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pdf-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(145deg, #fff1f2, #ffe4e6);
      color: var(--red);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 24px -10px rgba(225, 29, 72, 0.25);
    }

    .pdf-badge svg {
      width: 40px;
      height: 40px;
    }

    .main-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .main-description {
      font-size: 0.98rem;
      color: var(--text-secondary);
      max-width: 360px;
      margin: 0 auto 20px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 22px;
      text-align: right;
    }

    .file-info-icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #fff;
      color: var(--red);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .file-info-icon svg {
      width: 24px;
      height: 24px;
    }

    .file-info-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .file-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      word-break: break-all;
    }

    .file-size {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        background var(--transition),
        border-color var(--transition);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.4);
      outline-offset: 2px;
    }

    .btn:disabled,
    .btn[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-icon {
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .btn-icon svg {
      width: 21px;
      height: 21px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      box-shadow: 0 14px 28px -10px rgba(225, 29, 72, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      transform: translateY(-2px);
      box-shadow: 0 18px 32px -10px rgba(225, 29, 72, 0.45);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 8px 18px -8px rgba(225, 29, 72, 0.35);
    }

    .btn-secondary {
      background: #fff;
      color: var(--blue);
      border: 1.5px solid rgba(37, 99, 235, 0.3);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #f8fafc;
      border-color: rgba(37, 99, 235, 0.55);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:active:not(:disabled) {
      transform: translateY(0);
    }

    /* Contact Section */
    .contact-section {
      margin-top: 28px;
      animation: cardFadeUp 0.6s ease 0.15s both;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 14px;
      padding-right: 6px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 15px 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226, 232, 240, 0.9);
      text-decoration: none;
      color: inherit;
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .contact-card:hover {
      transform: translateX(-4px);
      box-shadow: var(--shadow-md);
      border-color: rgba(37, 99, 235, 0.25);
    }

    .contact-card:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.35);
      outline-offset: 2px;
    }

    .contact-icon {
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      background: #eff6ff;
      color: var(--blue);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background var(--transition), color var(--transition);
    }

    .contact-card:hover .contact-icon {
      background: var(--blue);
      color: #fff;
    }

    .contact-icon svg {
      width: 24px;
      height: 24px;
    }

    .contact-text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text);
    }

    .contact-subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .contact-arrow {
      flex-shrink: 0;
      color: #94a3b8;
      display: flex;
      align-items: center;
      transition: color var(--transition), transform var(--transition);
    }

    .contact-arrow svg {
      width: 20px;
      height: 20px;
    }

    .contact-card:hover .contact-arrow {
      color: var(--blue);
      transform: translateX(-2px);
    }

    /* Footer */
    .footer {
      margin-top: 32px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      animation: pageFadeIn 0.6s ease 0.25s both;
    }

    .footer p {
      letter-spacing: 0.02em;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px 28px;
      }

      .card {
        padding: 24px 16px;
        border-radius: 18px;
      }

      .main-title {
        font-size: 1.7rem;
      }

      .main-description {
        font-size: 0.92rem;
      }

      .btn {
        padding: 15px 14px;
        font-size: 0.95rem;
      }

      .contact-card {
        padding: 13px 14px;
        gap: 12px;
      }

      .contact-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      .contact-icon svg {
        width: 22px;
        height: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    'use strict';

    document.addEventListener('DOMContentLoaded', () => {
      // ================= تنظیمات قابل ویرایش =================
      const CONFIG = {
        // لینک مستقیم فایل PDF (مهم‌ترین بخش)
        pdfUrl: './زنجیره_تامین_صدر_آسیا.pdf',

        // نام نمایشی فایل (اختیاری)
        fileName: 'زنجیره_تامین_صدر_آسیا.pdf',

        // لوگو (در صورت تمایل URL تصویر قرار دهید؛ خالی = آیکون پیش‌فرض)
        logoUrl: './logo-2.png',

        // اطلاعات تماس
        phone: '09123357822', // شماره بدون فاصله
        phoneDisplay: '۰۹۱۲ ۳۳۵ ۷۸ ۲۲', // شماره نمایشی

        // لینک نقشه (Google Maps یا نشان)
        locationUrl: 'https://nshn.ir/37_bvkK3QxIjk5',
        locationText: 'مشاهده روی نقشه',

        // کانال‌های بله
        baleTransportUrl: 'https://ble.ir/join/CuTtYCMnnK',
        baleTransportText: 'ورود به کانال حمل و نقل',

        baleInsuranceUrl: 'https://ble.ir/join/9N6cg3YXv1',
        baleInsuranceText: 'ورود به کانال بیمه',

        // سایت صدرامال
        siteUrl: 'https://sadramall.com/',
        siteText: 'وب‌سایت رسمی صدرامال'
      };
      // =======================================================

      // عناصر DOM
      const downloadBtn = document.getElementById('downloadBtn');
      const viewBtn = document.getElementById('viewBtn');
      const fileNameEl = document.getElementById('fileName');
      const fileSizeEl = document.getElementById('fileSize');

      const phoneLink = document.getElementById('contactPhone');
      const phoneSub = document.getElementById('phoneSub');

      const locationLink = document.getElementById('contactLocation');
      const locationSub = document.getElementById('locationSub');

      const baleTransportLink = document.getElementById('contactBaleTransport');
      const baleTransportSub = document.getElementById('baleTransportSub');

      const baleInsuranceLink = document.getElementById('contactBaleInsurance');
      const baleInsuranceSub = document.getElementById('baleInsuranceSub');

      const siteLink = document.getElementById('contactSite');
      const siteSub = document.getElementById('siteSub');

      const logoWrapper = document.getElementById('logoWrapper');
      const logoImage = document.getElementById('logoImage');
      const logoFallback = document.getElementById('logoFallback');

      const isPdfConfigured =
        CONFIG.pdfUrl && CONFIG.pdfUrl.trim() !== '' && CONFIG.pdfUrl !== '#';

      // تنظیم نام و حجم فایل
      if (fileNameEl) {
        fileNameEl.textContent = CONFIG.fileName || 'فایل PDF';
      }

      if (fileSizeEl) {
        if (CONFIG.fileSize) {
          fileSizeEl.textContent = `حجم فایل: ${CONFIG.fileSize}`;
        } else {
          fileSizeEl.style.display = 'none';
        }
      }

      // تنظیم لوگو
      if (logoImage && logoFallback && logoWrapper) {
        if (CONFIG.logoUrl && CONFIG.logoUrl.trim() !== '') {
          logoImage.src = CONFIG.logoUrl;
          logoImage.style.display = 'block';
          logoFallback.style.display = 'none';
          logoWrapper.setAttribute('aria-label', 'لوگو مجموعه');
        } else {
          logoImage.style.display = 'none';
          logoFallback.style.display = 'flex';
        }
      }

      // تنظیم لینک تماس
      if (phoneLink) {
        phoneLink.href = `tel:${CONFIG.phone}`;
      }

      if (phoneSub) {
        phoneSub.textContent = CONFIG.phoneDisplay || CONFIG.phone;
      }

      // تنظیم لینک مکان
      if (locationLink) {
        locationLink.href = CONFIG.locationUrl;
        locationLink.target = '_blank';
        locationLink.rel = 'noopener';
      }

      if (locationSub) {
        locationSub.textContent = CONFIG.locationText || 'مشاهده روی نقشه';
      }

      // تنظیم کانال حمل و نقل بله
      if (baleTransportLink) {
        baleTransportLink.href = CONFIG.baleTransportUrl;
        baleTransportLink.target = '_blank';
        baleTransportLink.rel = 'noopener';
      }

      if (baleTransportSub) {
        baleTransportSub.textContent = CONFIG.baleTransportText || 'ورود به کانال';
      }

      // تنظیم کانال بیمه بله
      if (baleInsuranceLink) {
        baleInsuranceLink.href = CONFIG.baleInsuranceUrl;
        baleInsuranceLink.target = '_blank';
        baleInsuranceLink.rel = 'noopener';
      }

      if (baleInsuranceSub) {
        baleInsuranceSub.textContent = CONFIG.baleInsuranceText || 'ورود به کانال';
      }

      // تنظیم سایت صدرامال
      if (siteLink) {
        siteLink.href = CONFIG.siteUrl;
        siteLink.target = '_blank';
        siteLink.rel = 'noopener';
      }

      if (siteSub) {
        siteSub.textContent = CONFIG.siteText || 'وب‌سایت رسمی';
      }

      // دکمه دانلود
      if (downloadBtn && viewBtn) {
        if (!isPdfConfigured) {
          downloadBtn.disabled = true;
          downloadBtn.title = 'لینک فایل PDF تنظیم نشده است.';
          viewBtn.disabled = true;
          viewBtn.title = 'لینک فایل PDF تنظیم نشده است.';
        } else {
          downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = CONFIG.pdfUrl;
            link.download = CONFIG.fileName || 'file.pdf';
            link.rel = 'noopener';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          });

          viewBtn.addEventListener('click', () => {
            window.open(CONFIG.pdfUrl, '_blank', 'noopener');
          });
        }
      }
    });
  </script>
</body>
</html>
